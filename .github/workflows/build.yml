name: Build PSP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TempGBA
        run: |
          cd source
          make clean || true
          make
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempGBA-build
          path: |
            source/**/*.PBP
            source/**/*.pbp
            source/**/*.elf
            source/**/*.prx

      - name: Find build output
        run: |
          find source -iname "*.pbp"
          find source -iname "*.elf"
          find source -iname "*.prx"
