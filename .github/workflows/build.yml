name: Build PSP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TempGBA
        run: |
          make clean
          make

      - name: Find output
        run: |
          find . -name "*.PBP"
          find . -name "*.pbp"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempGBA-build
          path: |
            **/*.PBP
            **/*.pbp
