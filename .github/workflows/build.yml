name: Build PSP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          cd source
          make clean || true
          make

      - name: Find output
        run: |
          find source -iname "*.pbp"

      - name: Create Release Zip
        run: |
          mkdir release
          cp source/*.PBP release/ || true
          cp source/*.pbp release/ || true
          cd release
          zip TempGBA-custom.zip *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-build-${{ github.run_number }}
          name: TempGBA Custom Build ${{ github.run_number }}
          files: release/TempGBA-custom.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
